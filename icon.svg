<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" style="background: transparent;">
  <!-- 外圈紫色邊框 -->
  <circle 
    cx="200" cy="200" r="190" 
    fill="#6B00B0" 
    stroke="#8A2BE2" 
    stroke-width="18"/>
  
  <!-- 內部深紫色圓形背景 -->
  <circle 
    cx="200" cy="200" r="165" 
    fill="#4B0082"/>

  <!-- 內部漸層圓形 (紫色調) -->
  <defs>
    <radialGradient id="innerGrad" cx="45%" cy="45%" r="60%" fx="40%" fy="40%">
      <stop offset="0%" stop-color="#C84BFF"/>
      <stop offset="100%" stop-color="#6B00B0"/>
    </radialGradient>
  </defs>
  <circle 
    cx="200" cy="200" r="145" 
    fill="url(#innerGrad)"/>

  <!-- 金色 3D 文字 "3D" -->
  <!-- 文字陰影層 (增加3D深度) -->
  <text 
    x="200" y="225" 
    font-family="Arial Black, sans-serif" 
    font-size="115" 
    font-weight="900" 
    fill="#B8860B" 
    text-anchor="middle" 
    dominant-baseline="middle"
    filter="drop-shadow(4px 6px 3px rgba(0,0,0,0.6))">
    3D
  </text>

  <!-- 主金色文字 (亮面) -->
  <text 
    x="200" y="225" 
    font-family="Arial Black, sans-serif" 
    font-size="115" 
    font-weight="900" 
    fill="#FFD700" 
    text-anchor="middle" 
    dominant-baseline="middle"
    filter="drop-shadow(-3px -4px 6px rgba(255,255,200,0.8))">
    3D
  </text>

  <!-- 高光邊緣 (增強金屬質感) -->
  <text 
    x="200" y="225" 
    font-family="Arial Black, sans-serif" 
    font-size="115" 
    font-weight="900" 
    fill="none" 
    stroke="#FFEEAA" 
    stroke-width="4" 
    text-anchor="middle" 
    dominant-baseline="middle" 
    opacity="0.6">
    3D
  </text>
</svg>